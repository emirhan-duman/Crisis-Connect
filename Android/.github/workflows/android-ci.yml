name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Prepare Firebase placeholder config
        run: cp app/google-services.json.example app/google-services.json

      - name: Run lint and unit tests
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest --no-daemon
