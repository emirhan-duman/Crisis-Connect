name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill out the sections below so we can reproduce and fix the issue.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: "Found in Settings > About (e.g., 1.0.0)"
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: "Device model and OS version"
      placeholder: "Samsung Galaxy S24, Android 15 / iPhone 15 Pro, iOS 18.1"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "A clear description of what happened."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "How can we reproduce the issue?"
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "What should have happened?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: "What actually happened?"
    validations:
      required: true

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature Area
      options:
        - Messaging (P2P chat)
        - Voice calls
        - GATT mesh
        - QR code / contact exchange
        - SOS broadcast
        - Rescue operations
        - Offline maps
        - Emergency tools (compass, whistle, etc.)
        - Survival guide
        - Settings / profile
        - Authentication
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: "If applicable, add screenshots or crash logs."
    validations:
      required: false
