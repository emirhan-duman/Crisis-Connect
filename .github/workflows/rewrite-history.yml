name: Rewrite Git History

on:
  workflow_dispatch:

jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "Emirhan Duman"
          git config user.email "78927473+emirhan-duman@users.noreply.github.com"

      - name: Rewrite all commits to new SHAs
        run: |
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter '
            export GIT_COMMITTER_NAME="Emirhan Duman"
            export GIT_COMMITTER_EMAIL="78927473+emirhan-duman@users.noreply.github.com"
            export GIT_AUTHOR_NAME="Emirhan Duman"
            export GIT_AUTHOR_EMAIL="78927473+emirhan-duman@users.noreply.github.com"
          ' -- --all

      - name: Force push
        run: |
          git push origin main --force
          git push origin --tags --force
