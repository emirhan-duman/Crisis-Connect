name: Sign release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose APK/AAB assets will be signed
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign-release-assets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download, sign, verify, and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/sign-release-assets.yml@refs/heads/main
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]; then
            echo "Release tag must use a version form such as v1.2.3" >&2
            exit 1
          fi

          mkdir release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --dir release-assets \
            --pattern '*.apk' \
            --pattern '*.aab'

          mapfile -t assets < <(find release-assets -type f \( -name '*.apk' -o -name '*.aab' \) -print)
          if (( ${#assets[@]} == 0 )); then
            echo "No APK or AAB assets found for $RELEASE_TAG" >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            bundle="${asset}.sigstore.json"
            cosign sign-blob --yes --bundle "$bundle" "$asset"
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$asset"
            gh release upload "$RELEASE_TAG" "$bundle" --repo "$REPOSITORY" --clobber
          done
