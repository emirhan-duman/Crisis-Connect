name: Sign release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose APK/AAB assets will be signed
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign-release-assets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]; then
            echo "Release tag must use a version form such as v1.2.3" >&2
            exit 1
          fi

          mkdir release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --dir release-assets \
            --pattern '*.apk' \
            --pattern '*.aab'

          mapfile -t assets < <(find release-assets -type f \( -name '*.apk' -o -name '*.aab' \) -print)
          if (( ${#assets[@]} == 0 )); then
            echo "No APK or AAB assets found for $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Generate release SBOM and checksums
        id: sbom
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          sbom="release-assets/crisis-connect-${version}.cyclonedx.json"
          checksums="release-assets/crisis-connect-${version}.assets.sha256"

          cp Android/app/google-services.json.example Android/app/google-services.json
          ./Android/gradlew -p Android cyclonedxBom \
            -PreleaseVersion="$version" \
            --no-daemon
          cp Android/build/reports/cyclonedx/bom.json "$sbom"

          (
            cd release-assets
            mapfile -t assets < <(find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' \) -print | sort)
            sha256sum "${assets[@]}" > "$(basename "$checksums")"
          )

          echo "path=$sbom" >> "$GITHUB_OUTPUT"
          echo "checksums=$checksums" >> "$GITHUB_OUTPUT"

      - name: Attest release SBOM
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ steps.sbom.outputs.checksums }}
          sbom-path: ${{ steps.sbom.outputs.path }}

      - name: Sign, verify, and upload release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SBOM_PATH: ${{ steps.sbom.outputs.path }}
          CHECKSUMS_PATH: ${{ steps.sbom.outputs.checksums }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/sign-release-assets.yml@refs/heads/main
        run: |
          version="${RELEASE_TAG#v}"
          stable_attestation="release-assets/crisis-connect-${version}.sbom.intoto.jsonl"
          cp "$ATTESTATION_BUNDLE" "$stable_attestation"

          mapfile -t assets < <(find release-assets -type f \( -name '*.apk' -o -name '*.aab' \) -print | sort)
          signed_files=("${assets[@]}" "$SBOM_PATH" "$CHECKSUMS_PATH")

          for asset in "${signed_files[@]}"; do
            bundle="${asset}.sigstore.json"
            cosign sign-blob --yes --bundle "$bundle" "$asset"
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$asset"
            gh release upload "$RELEASE_TAG" "$bundle" --repo "$REPOSITORY" --clobber
          done

          gh release upload "$RELEASE_TAG" \
            "$SBOM_PATH" \
            "$CHECKSUMS_PATH" \
            "$stable_attestation" \
            --repo "$REPOSITORY" \
            --clobber
