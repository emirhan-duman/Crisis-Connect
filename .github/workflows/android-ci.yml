name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "Android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare public Firebase configuration
        run: cp app/google-services.json.example app/google-services.json

      - name: Build and smoke-test native frame fuzz target
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=address,fuzzer \
            -I app/src/main/cpp \
            app/src/test/cpp/frame_copy_fuzz.cpp \
            -o "${{ runner.temp }}/frame_copy_fuzz"
          "${{ runner.temp }}/frame_copy_fuzz" -runs=10000

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :feature_rescue:testDebugUnitTest --no-daemon
